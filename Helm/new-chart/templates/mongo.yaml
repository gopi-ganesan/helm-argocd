apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.mongodb.serviceName }}
  namespace: {{ .Values.mongodb.namespace }}
  labels:
    app: {{ .Values.mongodb.app }}
spec:
  clusterIP: None
  selector:
    app: {{ .Values.mongodb.app }}
  ports:
    - port: {{ .Values.mongodb.port }}
      targetPort: {{ .Values.mongodb.port }}

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.mongodb.name }}
  namespace: {{ .Values.mongodb.namespace }}
spec:
  serviceName: {{ .Values.mongodb.serviceName }}
  replicas: {{ .Values.mongodb.replicas }}

  selector:
    matchLabels:
      app: {{ .Values.mongodb.app }}

  template:
    metadata:
      labels:
        app: {{ .Values.mongodb.app }}

    spec:
      containers:
        - name: mongodb
          image: {{ .Values.mongodb.image }}
          imagePullPolicy: {{ .Values.mongodb.pullPolicy }}

          ports:
            - containerPort: {{ .Values.mongodb.port }}

          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: mongo-root-username

            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: mongo-root-password

            - name: MONGO_INITDB_DATABASE
              value: {{ .Values.mongodb.dbName }}

          volumeMounts:
            - name: data
              mountPath: /data/db

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - db.adminCommand('ping')
            initialDelaySeconds: 30
            periodSeconds: 10

          readinessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - db.adminCommand('ping')
            initialDelaySeconds: 15
            periodSeconds: 10

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce

        storageClassName: {{ .Values.mongodb.storageClassName }}

        resources:
          requests:
            storage: {{ .Values.mongodb.storage.size }}